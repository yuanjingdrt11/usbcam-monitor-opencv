[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usbcam-monitor"
version = "3.0.0"
description = "USB(UVC) 相机过曝光优化 + 参数监视 + 扫码：帧率上限探测、ROI 切割、软件自动曝光、二维码识别"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "usbcam-monitor contributors" }]
keywords = ["usb", "uvc", "camera", "v4l2", "opencv", "exposure", "qr-code", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    # QRCodeDetectorAruco / barcode 在 contrib 包里；缺失时代码会自动降级
    "opencv-contrib-python>=4.8",
    "numpy>=1.24",
    "Pillow>=9.0",          # 扫码弹窗渲染中文（缺失时自动退回 ASCII）
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
usbcam = "usbcam.app:main"

[project.urls]
Homepage = "https://github.com/your-name/usbcam-monitor"

[tool.setuptools]
packages = ["usbcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
